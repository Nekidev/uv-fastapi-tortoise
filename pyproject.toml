[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "nanoid>=2.0.0",
    "orjson>=3.11.5",
    "python-dotenv>=1.2.1",
    "tortoise-orm[accel,asyncpg]>=1.1.7",
]

[project.scripts]
"run:debug" = "scripts.run_debug:main"
"run:release" = "scripts.run_release:main"

[tool.tortoise]
tortoise_orm = "project.lib.settings.DATABASE"

[tool.ruff]
lint.ignore = ["I001"]
line-length = 100

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["project*", "scripts*"]
exclude = ["data*", "vendored*"]
